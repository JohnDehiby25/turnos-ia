spring:
  application:
    name: turnosia
  datasource:
    # URL y usuario tienen valor por defecto para desarrollo local; DB_PASSWORD es obligatoria (sin valor por defecto).
    url: ${DB_URL:jdbc:postgresql://localhost:5432/turnosia}
    username: ${DB_USER:turnosia}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8080
