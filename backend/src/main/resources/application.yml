spring:
  application:
    name: turnosia
  datasource:
    # URL y usuario tienen valor por defecto para desarrollo local; DB_PASSWORD es obligatoria (sin valor por defecto).
    url: ${DB_URL:jdbc:postgresql://localhost:5432/turnosia}
    username: ${DB_USER:turnosia}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8080

app:
  security:
    cors:
      # Orígenes permitidos del front, separados por coma.
      allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}
    login:
      max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
      window-minutes: ${LOGIN_WINDOW_MINUTES:15}
      lockout-minutes: ${LOGIN_LOCKOUT_MINUTES:15}
  admin:
    # Usuaria del sistema. ADMIN_PASSWORD vacío = no se toca la cuenta existente.
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}
