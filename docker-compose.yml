# Solo la base de datos para desarrollo local (E1-T1).
# Los servicios backend y frontend se agregan en la etapa E4.
services:
  db:
    image: pgvector/pgvector:pg16@sha256:484e838076e04939d27d3e176e91c86eea96236126023be8d3059761122e579f
    container_name: turnosia-db
    environment:
      POSTGRES_DB: turnosia
      POSTGRES_USER: ${DB_USER:-turnosia}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en tu archivo .env}
    ports:
      - "127.0.0.1:5432:5432"   # solo accesible desde tu computador
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-turnosia} -d turnosia"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
